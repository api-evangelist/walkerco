name: WalkerCo
description: >-
  Walker & Company Brands (WalkerCo) is a health and beauty company founded by
  Tristan Walker that designs grooming and personal-care products for people of
  color. Its flagship brand, Bevel, sells shaving systems, razors, skin, hair,
  and beard-care products direct-to-consumer, and the company also operates the
  FORM hair-care line. Walker & Company was acquired by Procter & Gamble in 2018
  and its storefronts run on Shopify. The company does not publish a public
  developer API or developer portal; its programmatic surface is limited to the
  Shopify-provided Customer Account OAuth/OIDC endpoints on the Bevel storefront
  and an internal-tooling GitHub organization. This profile was surfaced as a
  500 Global portfolio company and enriched from public web sources.
